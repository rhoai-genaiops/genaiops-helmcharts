---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.USER_NAME }}-test-edit
  namespace: {{ .Values.USER_NAME }}-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: pipeline
  namespace: {{ .Values.USER_NAME }}-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.USER_NAME }}-prod-edit
  namespace: {{ .Values.USER_NAME }}-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: pipeline
  namespace: {{ .Values.USER_NAME }}-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-dspa-view-test
  namespace: {{ .Values.USER_NAME }}-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: {{ .Values.USER_NAME }}-toolings
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.USER_NAME }}-tekton-image-pusher-rolebinding
  namespace: {{ .Values.USER_NAME }}-test
subjects:
- kind: ServiceAccount
  name: pipeline
  namespace: {{ .Values.USER_NAME }}-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-pusher
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.USER_NAME }}-toolings-mlflow
  namespace: {{ .Values.USER_NAME }}-toolings
subjects:
  - kind: ServiceAccount
    name: {{ .Values.USER_NAME }}-canopy
    namespace: {{ .Values.USER_NAME }}-canopy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlflow-operator-mlflow-integration

